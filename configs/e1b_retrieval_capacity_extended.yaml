# E1b — Extended retrieval capacity sweep (push corpus size up to move d*).
# Larger n_d to demonstrate the critical dimension d* itself increasing (the wall),
# not just sub-critical degradation. Heavier — intended for the Kaggle GPU loop, but
# small enough to also run on CPU.
name: e1b_retrieval_capacity_extended
experiment: e1_retrieval_capacity
seed: 0
verbose: false

params:
  pattern: all_pairs
  k: 2
  dims: [4, 8, 16, 32]
  n_d_list: [40, 80, 160, 320]
  seeds: [0, 1]
  max_queries: 1500
  steps: 500
  lr: 0.05
  margin: 1.0
  realize_thresh: 0.99
