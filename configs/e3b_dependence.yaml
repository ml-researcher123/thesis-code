# E3b — Hardness dependence: super- vs sub-multiplicative compounding.
# Holds real E1/E2 marginals fixed at tight operating points and sweeps the
# retrieval<->compression hardness correlation rho. Shows compounding goes
# super-multiplicative (below the independent product) only when hardness is
# anti-correlated. Kaggle-first: NO results committed locally.
name: e3b_dependence
experiment: e3b_dependence
seed: 0
verbose: false

params:
  seeds: [0, 1, 2]
  rhos: [-0.9, -0.75, -0.5, -0.25, 0.0, 0.25, 0.5, 0.75, 0.9]
  operating_points: [[16, 48], [32, 32], [32, 64]]   # (d_r, D_c), both sub-saturated

  retrieval:
    pattern: random_ksubsets
    n_d: 256
    k: 64
    n_q: 256
    steps: 500
    lr: 0.05
    margin: 1.0

  compression:
    n_f: 64
    d_c: 16
    V: 4
    d_key: 128
    P: 128
    steps: 1500
    lr: 0.003
