# E9d — real-QA compounding on a SECOND multi-hop dataset (2WikiMultihopQA), mirroring how C1's
# cross-dataset generality strengthened the retrieval wall. Same E9b pipeline/grid/reader (1.5B),
# dataset swapped to 2wiki. Seed0 first (cheap pilot): if the compounding gap + interior optimum
# appear here too, it's not a HotpotQA artifact; add seeds 1,2 for the 3-seed claim if it holds.
name: e9d_2wiki_seed1
experiment: e9_real_qa
seed: 1

params:
  dataset: 2wiki
  embedder: mixedbread-ai/mxbai-embed-large-v1
  reader: Qwen/Qwen2.5-1.5B-Instruct
  query_prompt: "Represent this sentence for searching relevant passages: "
  split: validation
  n_q: 300
  seed_data: 1
  top_k: 4
  budget_tokens: 160
  budgets: [128, 256]
  splits: [16, 32, 48, 64, 80, 96, 112, 128, 144, 160, 176, 192, 224]
  max_new_tokens: 24
  gen_batch: 16
