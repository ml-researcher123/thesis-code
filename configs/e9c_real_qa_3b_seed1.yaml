# E9c seed1 — reader-scale robustness for the real-QA compounding result: same E9b pipeline
# and d_r grid, stronger reader (Qwen2.5-3B). Seeds {0,1,2} give the 3-seed variance to match
# E9b's rigor bar. Seed0 already showed the compounding gap persists at 3B (+0.053 at B=128).
name: e9c_real_qa_3b_seed1
experiment: e9_real_qa
seed: 1

params:
  embedder: mixedbread-ai/mxbai-embed-large-v1
  reader: Qwen/Qwen2.5-3B-Instruct
  query_prompt: "Represent this sentence for searching relevant passages: "
  split: validation
  n_q: 300
  seed_data: 1
  top_k: 4
  budget_tokens: 160
  budgets: [128, 256]
  splits: [16, 32, 48, 64, 80, 96, 112, 128, 144, 160, 176, 192, 224]
  max_new_tokens: 24
  gen_batch: 16
