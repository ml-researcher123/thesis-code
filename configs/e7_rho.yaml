# E7 — Measure the hardness correlation rho for a real retriever+compressor (closes F10).
# Reuses E6's shared corpus and real components; records per-query retrieval & compression
# margins, computes rho (phi + Pearson), and validates the E3b copula against observed
# end-to-end recall. Tells us which compounding regime real systems live in. Kaggle-first.
name: e7_rho
experiment: e7_rho
seed: 0

params:
  model: mixedbread-ai/mxbai-embed-large-v1
  N: 2000
  n_f: 8
  points: [[64, 64], [96, 96], [128, 128]]   # balanced, sub-saturated (E3b: effect largest here)
  n_query: 1500
  steps: 500
  lr: 0.002
  key_trunc: 64
  seed_data: 0
